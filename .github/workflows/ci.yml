name: Frontend CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate environment example
        run: npm run env:validate

      - name: Audit dependencies (fail only on high/critical)
        run: |
          npm audit --json > audit.json || true
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const reportPath = path.join(process.cwd(), 'audit.json');
          const data = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
          const vulnerabilities = data.metadata?.vulnerabilities || {};
          const high = Number(vulnerabilities.high || 0);
          const critical = Number(vulnerabilities.critical || 0);

          if (high > 0 || critical > 0) {
            console.error(`Found high/critical vulnerabilities: high=${high} critical=${critical}`);
            process.exit(1);
          }

          console.log(`No high/critical vulnerabilities found. Low/moderate counts: low=${vulnerabilities.low || 0}, moderate=${vulnerabilities.moderate || 0}`);
          NODE

      - name: Lint
        run: npm run lint
        env:
          VITE_API_URL: http://localhost:3000
          VITE_WS_URL: ws://localhost:3000

      - name: Type check
        run: npm run type-check
        env:
          VITE_API_URL: http://localhost:3000
          VITE_WS_URL: ws://localhost:3000

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: http://localhost:3000
          VITE_WS_URL: ws://localhost:3000
